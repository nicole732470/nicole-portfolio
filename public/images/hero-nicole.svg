<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffaf2"/>
    <stop offset="0.55" stop-color="#f8ead8"/>
    <stop offset="1" stop-color="#f2d7b8"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c7e2ee"/>
    <stop offset="1" stop-color="#fff2dd"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2b1c12" flood-opacity=".12"/>
  </filter>
  <style>
    .serif { font-family: Georgia, serif; }
    .sans { font-family: Inter, Arial, sans-serif; }
    .hand { font-family: "Comic Sans MS", "Trebuchet MS", cursive; }
  </style>
</defs>
<rect width="1100" height="720" rx="42" fill="url(#bg)"/>
<circle cx="175" cy="150" r="140" fill="#e17857" opacity=".12"/>
<circle cx="920" cy="105" r="155" fill="#8bb8c7" opacity=".18"/>

<!-- window -->
<g filter="url(#shadow)">
<rect x="780" y="55" width="245" height="245" rx="20" fill="#f8ecd9" stroke="#e8dcc9"/>
<rect x="800" y="78" width="205" height="182" rx="10" fill="url(#sky)"/>
